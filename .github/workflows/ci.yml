name: Three-platform production release gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read product version
        id: product_version
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Prepare pinned SNES runtime
        run: ./scripts/bootstrap-snesrecomp.sh
      - name: Build, test, and audit AppImage
        run: ./packaging/linux/build-linux.sh
      - name: Retain Linux release package
        uses: actions/upload-artifact@v6
        with:
          name: FairyWriter-${{ steps.product_version.outputs.version }}-linux-x86_64
          path: |
            release-linux-x86_64/FairyWriter-${{ steps.product_version.outputs.version }}-x86_64.AppImage
            release-linux-x86_64/FairyWriter-${{ steps.product_version.outputs.version }}-x86_64.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read product version
        id: product_version
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install native build dependencies
        run: brew install cmake ninja qt go python
      - name: Prepare pinned SNES runtime
        run: ./scripts/bootstrap-snesrecomp.sh
      - name: Build, test, sign, and audit DMG
        run: ./mac_deploy.sh
      - name: Retain macOS release package
        uses: actions/upload-artifact@v6
        with:
          name: FairyWriter-${{ steps.product_version.outputs.version }}-macos-arm64
          path: |
            release-macos-arm64/FairyWriter-${{ steps.product_version.outputs.version }}-macos-arm64.dmg
            release-macos-arm64/FairyWriter-${{ steps.product_version.outputs.version }}-macos-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read product version
        id: product_version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true
      - name: Prepare pinned SNES runtime
        shell: bash
        run: ./scripts/bootstrap-snesrecomp.sh
      - name: Build, test, deploy, and audit ZIP
        shell: pwsh
        run: |
          ./packaging/windows/build-windows.ps1 `
            -QtPrefix $env:QT_ROOT_DIR `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT
      - name: Retain Windows release package
        uses: actions/upload-artifact@v6
        with:
          name: FairyWriter-${{ steps.product_version.outputs.version }}-windows-x64
          path: |
            release-windows-x64/FairyWriter-${{ steps.product_version.outputs.version }}-windows-x64.zip
            release-windows-x64/FairyWriter-${{ steps.product_version.outputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
