name: Linux production gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SNES runtime
        run: ./scripts/bootstrap-snesrecomp.sh
      - name: Build, test, and audit AppImage
        run: ./packaging/linux/build-linux.sh
